<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミセスの曲 実在する？しない？クイズ</title>
  <style>
    :root {
      --primary-color: #00d2ff;
      --secondary-color: #3a7bd5;
      --bg-color: #f0f8ff;
      --text-color: #333;
    }
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    .question-box {
      font-size: 2rem;
      font-weight: bold;
      margin: 30px 0;
      padding: 20px;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
    }
    .btn {
      background: #fff;
      color: var(--secondary-color);
      border: none;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .hidden {
      display: none;
    }
    #result-list {
      text-align: left;
      font-size: 0.9rem;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 8px;
    }
    #result-list div {
      margin-bottom: 5px;
    }
    .bgm-control {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- BGM音声ファイル -->
  <audio id="bgmAudio" src="bgm.mp3" loop></audio>

  <div id="bgm-toggle" class="bgm-control hidden">BGM: ON</div>

  <div class="container" id="screen-start">
    <h1>🍏 ミセスの曲<br>実在する？しない？クイズ</h1>
    <p>全40問の中からランダムに10問出題されます。<br>本当にMrs. GREEN APPLEの曲として存在するかを当ててください！</p>
    <button class="btn" id="start-btn">スタート（BGM再生）</button>
  </div>

  <div class="container hidden" id="screen-quiz">
    <h2 id="q-counter">第 1 問 / 10</h2>
    <div class="question-box" id="song-title">曲名</div>
    <div>
      <button class="btn" onclick="answer(true)">実在する⭕️</button>
      <button class="btn" onclick="answer(false)">実在しない❌</button>
    </div>
  </div>

  <div class="container hidden" id="screen-result">
    <h1>結果発表 🎉</h1>
    <h2 id="score-text">10問中 8問 正解！</h2>
    <div id="result-list"></div>
    <button class="btn" onclick="initQuiz()">もう一度遊ぶ</button>
  </div>

  <script>
    // 楽曲データベース (全40問：実在20問、架空20問)
    const songData = [
      // 実在する曲
      { title: "インフェルノ", isReal: true },
      { title: "青と夏", isReal: true },
      { title: "ケセラセラ", isReal: true },
      { title: "ライラック", isReal: true },
      { title: "ダンスホール", isReal: true },
      { title: "我逢人", isReal: true },
      { title: "アウフヘーベン", isReal: true },
      { title: "ア・プリオリ", isReal: true },
      { title: "Soranji", isReal: true },
      { title: "WanteD! WanteD!", isReal: true },
      { title: "ロマンチシズム", isReal: true },
      { title: "鯨の唄", isReal: true },
      { title: "橙", isReal: true },
      { title: "サママ・フェスティバル！", isReal: true },
      { title: "僕のこと", isReal: true },
      { title: "庶幾の唄", isReal: true },
      { title: "フロリジナル", isReal: true },
      { title: "Magic", isReal: true },
      { title: "StaRt", isReal: true },
      { title: "Speaking", isReal: true },
      // 実在しない曲（架空）
      { title: "春の風", isReal: false },
      { title: "サイネリア", isReal: false },
      { title: "夏の終わりの約束", isReal: false },
      { title: "タイムトラベラー", isReal: false },
      { title: "空想列車", isReal: false },
      { title: "青い春のせい", isReal: false },
      { title: "ミッドナイトパレード", isReal: false },
      { title: "スターダスト", isReal: false },
      { title: "ユートピアの嘘", isReal: false },
      { title: "夢幻泡影", isReal: false },
      { title: "クロノグラフ", isReal: false },
      { title: "ノスタルジック・ブルー", isReal: false },
      { title: "シグナルレッド", isReal: false },
      { title: "プラネット", isReal: false },
      { title: "アンコール", isReal: false },
      { title: "水彩画", isReal: false },
      { title: "サヨナラマーチ", isReal: false },
      { title: "スカイライン", isReal: false },
      { title: "閃光", isReal: false },
      { title: "リフレイン", isReal: false }
    ];

    let quizList = [];
    let currentIndex = 0;
    let score = 0;
    let history = [];
    let isBgmPlaying = false;

    const screenStart = document.getElementById('screen-start');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenResult = document.getElementById('screen-result');
    const bgmAudio = document.getElementById('bgmAudio');
    const bgmToggle = document.getElementById('bgm-toggle');

    // BGMの再生（ブラウザの自動再生ブロック対策でクリック時に発火）
    document.getElementById('start-btn').addEventListener('click', () => {
      bgmAudio.play().then(() => {
        isBgmPlaying = true;
        bgmToggle.classList.remove('hidden');
      }).catch(e => {
        console.log("BGMの再生に失敗しました（ファイルがない等）", e);
      });
      initQuiz();
    });

    // BGMオンオフ切り替え
    bgmToggle.addEventListener('click', () => {
      if (isBgmPlaying) {
        bgmAudio.pause();
        bgmToggle.textContent = "BGM: OFF";
      } else {
        bgmAudio.play();
        bgmToggle.textContent = "BGM: ON";
      }
      isBgmPlaying = !isBgmPlaying;
    });

    function initQuiz() {
      // 40問からランダムに10問を抽出
      let shuffled = songData.sort(() => 0.5 - Math.random());
      quizList = shuffled.slice(0, 10);
      
      currentIndex = 0;
      score = 0;
      history = [];

      screenStart.classList.add('hidden');
      screenResult.classList.add('hidden');
      screenQuiz.classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      document.getElementById('q-counter').textContent = `第 ${currentIndex + 1} 問 / 10`;
      document.getElementById('song-title').textContent = quizList[currentIndex].title;
    }

    function answer(userChoice) {
      const currentSong = quizList[currentIndex];
      const isCorrect = (userChoice === currentSong.isReal);
      
      if (isCorrect) score++;

      history.push({
        title: currentSong.title,
        correct: isCorrect,
        realInfo: currentSong.isReal ? "実在する⭕️" : "架空❌"
      });

      currentIndex++;

      if (currentIndex < 10) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      screenQuiz.classList.add('hidden');
      screenResult.classList.remove('hidden');

      document.getElementById('score-text').textContent = `10問中 ${score}問 正解！`;

      const resultList = document.getElementById('result-list');
      resultList.innerHTML = '';
      history.forEach((item, i) => {
        const mark = item.correct ? "✅" : "❌";
        resultList.innerHTML += `<div>${i+1}. ${mark} ${item.title} (${item.realInfo})</div>`;
      });
    }
  </script>
</body>
</html>
